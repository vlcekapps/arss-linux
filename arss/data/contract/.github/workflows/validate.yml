name: Validate contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable inputs
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate schemas, catalogues, fixtures, and checksums
        run: python tools/validate.py

      - name: Run contract tests
        run: python -m unittest discover -s tests -v
